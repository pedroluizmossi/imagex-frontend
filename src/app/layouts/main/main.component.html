<ion-split-pane when="xl" contentId="main">
  <ion-menu contentId="main">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>ImageX</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list [inset]="false" lines="none">
        <ion-item>
          <ion-label>Pokémon Yellow</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Mega Man X</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>The Legend of Zelda</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Pac-Man</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Super Mario World</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
    <ion-footer>
      <ion-toolbar>
        <ion-item lines="none" detail="false" slot="start">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>{{ username }}</ion-label>
        </ion-item>
        <ion-item lines="none" detail="false">
          <ion-button fill="clear" color="danger" (click)="authService.logout()">
            <ion-icon name="log-out-outline" slot="icon-only" style="font-size: 32px;"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-toolbar>
    </ion-footer>
  </ion-menu>

  <div class="ion-page" id="main">
    <ion-content>
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>
</ion-split-pane>
